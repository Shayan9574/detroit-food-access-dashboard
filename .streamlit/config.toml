[server]
headless = true
enableXsrfProtection = true
runOnSave = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0E6E73"
backgroundColor = "#F4F6F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D2B36"
font = "sans serif"

[mapbox]
# Basemaps come from CARTO and need no token. A placeholder stops Streamlit
# from requesting its own Mapbox token at start-up.
token = "not-needed-carto-basemap"
